services:
  db:
    image: postgres:16-alpine
    container_name: starhoop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starhoop
    ports:
      - "5432:5432"
    volumes:
      - starhoop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starhoop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starhoop-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/starhoop
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/starhoop
      APP_ENV: docker
    ports:
      - "8000:8000"
    volumes:
      - ${USERPROFILE}/.modal.toml:/root/.modal.toml:ro
      - ./uploads/videos:/app/uploads/videos
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  starhoop-postgres-data: